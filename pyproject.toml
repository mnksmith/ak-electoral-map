[project]
name = "ak-electoral-map"
version = "0.1.0"
description = "Precinct-level map of where Peltola (2024 US House) outperformed Harris (2024 Pres) in Alaska"
readme = "README.md"
authors = [
    { name = "mnksmith", email = "mnksmith@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pdfplumber>=0.11.9",
    "pyarrow>=24.0.0",
    "pyproj>=3.5,<3.7",
    "requests>=2.33.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
